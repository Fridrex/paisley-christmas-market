project_id = "paisley-christmas-market"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
enable_signup = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
minimum_password_length = 8

[auth.email]
enabled = true
enable_confirmations = true

[local_smtp]
enabled = true
port = 54324
